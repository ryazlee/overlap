<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="Simple multi-day cycling map generator. Drop Strava GPX files, overlay days on one map, export a PNG. GPX stays in your browser."
    />
    <meta property="og:site_name" content="Overlap" />
    <meta property="og:title" content="Overlap: simple multi-day cycling map generator" />
    <meta
      property="og:description"
      content="Drop Strava GPX files, overlay days on one map, export a high-res PNG. Local-first — GPX never leaves your device."
    />
    <meta property="og:image" content="https://ryazlee.github.io/overlap/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:url" content="https://ryazlee.github.io/overlap/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Overlap: simple multi-day cycling map generator" />
    <meta
      name="twitter:description"
      content="Drop Strava GPX files, overlay days on one map, export a high-res PNG. Local-first — GPX never leaves your device."
    />
    <meta name="twitter:image" content="https://ryazlee.github.io/overlap/og.png" />
    <title>Overlap: simple multi-day cycling map generator</title>
    <script>
      try {
        var saved = localStorage.getItem('overlap-theme')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('theme-dark')
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', '#09090b')
        }
      } catch (e) {}
    </script>
    <script>
      window.goatcounter = { no_onload: true }
    </script>
    <script
      data-goatcounter="https://ryab.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
